<!-- dadjoks/templates/dadjokes/random.html -->
{% extends 'dadjokes/base.html' %}
{% block content %}
<h2>Random Joke</h2>
{% if joke %}<p>{{joke.text}}</p><p><em>Contributed by {{joke.name}}</em></p>{% else %}<p>No jokes yet.</p>{% endif %}
{% if picture %}<img src="{{picture.image_url}}" width="400"><p><em>Contributed by {{picture.name}}</em></p>{% endif %}
{% endblock %}
