<!-- mini_insta/templates/mini_insta/login.html -->
{% extends 'mini_insta/base.html' %}

{% block content %}
<main>
    <h2>Log In</h2>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{% url 'show_all' %}">
        <input type="submit" value="Log In" >
    </form>
</main>
{% endblock %}
