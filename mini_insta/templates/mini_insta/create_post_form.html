{% extends 'mini_insta/base.html' %}

{% block content %}
<main class="grid-container" style="display: block;">
    <h2>Create a New Post</h2>

    <form action="{% url 'create_post' profile.pk %}" method="POST">
        {% csrf_token %}
        
        <!-- Render the form fields automatically -->
        {{ form.as_p }}

        <div>
            <input type="submit" value="Submit Post">
            <a href="{% url 'profile' profile.pk %}">Cancel</a>
        </div>
    </form>
</main>
{% endblock %}
