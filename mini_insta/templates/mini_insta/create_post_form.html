<!-- mini_insta/templates/mini_insta/create_post_form.html -->
{% extends 'mini_insta/base.html' %}

{% block content %}
<main class="grid-container" style="display: block;">
    <h2>Create a New Post</h2>

    <form action="{% url 'create_post' profile.pk %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <label>Select Photos:</label>
        <input type="file" name="files" multiple>
        <br><br>

        {{ form.as_p }}

        <div>
            <input type="submit" value="Post">
            <a href="{% url 'profile' profile.pk %}">Cancel</a>
        </div>
    </form>
</main>
{% endblock %}
