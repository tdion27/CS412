<!-- mini_insta/templates/mini_insta/base.html -->
{% load static %}
<html>
    <head>
        <title>Welcome to Mini Instagram</title>
        <link rel="stylesheet" href="{% static 'mini_insta_style.css' %}">
    </head>
    <body>
        <header>
            <h1>Mini Instagram</h1>
        </header>
    
    {% block content %}
    {% endblock %}    
    
    <footer>
        {% if profile %}
        <a href="{% url 'show_feed' profile.pk %}">My Feed</a>
        <a href="{% url 'search' profile.pk %}">Search</a>
        <a href="{% url 'create_post' profile.pk %}">New Post</a>
        <a href="{% url 'profile' profile.pk %}">Profile</a>
        {% endif %}
        <a href="{% url 'show_all' %}">Show All Profiles</a>
    </footer>
    </body>
</html>
