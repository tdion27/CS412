<!-- mini_insta/templates/mini_insta/base.html -->
{% load static %}
<html>
    <head>
        <title>Welcome to Mini Instagram</title>
        <link rel="stylesheet" href="{% static 'mini_insta_style.css' %}">
    </head>
    <body>
        <header>
            <h1>Mini Instagram</h1>
        </header>
    
    {% block content %}
    {% endblock %}    
    
    <footer>
        {% if request.user.is_authenticated %}
        <p>Logged in as: {{ request.user.username }}</p>
        <a href="{% url 'show_feed' %}">Feed</a>
        <a href="{% url 'search' %}">Search</a>
        <a href="{% url 'create_post' %}">New Post</a>
        <a href="{% url 'profile' %}">My Profile</a>
        <form action="{% url 'logout' %}" method="POST" style="display: inline;">
        {% csrf_token %}
        <button type="submit">Logout</button>
        </form>
        {% else %}
        <p>Not logged in</p>
        <a href="{% url 'show_all' %}">Home</a>
        <a href="{% url 'login' %}">Log In</a>
        <a href="{% url 'create_profile' %}">Register</a>
        {% endif %}
    </footer>
    </body>
</html>
